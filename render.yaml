services:
  - type: web
    name: yuv-bot
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: yuv-bot-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: GOOGLE_CLIENT_ID
        sync: false
